<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중소 남돌 구절판</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7f8;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","PingFang TC",Arial,sans-serif}header{text-align:center;padding:18px 10px 8px}h1{margin:0;font-size:28px;letter-spacing:2px}.sub{font-size:12px;color:#999;margin-top:4px}main{max-width:900px;margin:auto;padding:8px 12px 30px}#status{text-align:center;color:#777;font-size:13px;margin:10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:720px;margin:auto}.card{background:#fff;border:2px solid transparent;border-radius:12px;padding:6px;text-align:center;cursor:pointer;box-shadow:0 2px 10px #0001}.card.selected{border-color:#e58aa6;background:#fff1f5}.photo{width:100%;aspect-ratio:1;background:#eee;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}.photo img{width:100%;height:100%;object-fit:cover;display:block}.name{font-weight:700;font-size:14px;margin-top:5px}.group{font-size:10px;color:#999;margin-top:2px}button{display:block;margin:16px auto 0;border:0;border-radius:22px;padding:10px 38px;background:#333;color:white;font-size:15px}button:disabled{background:#ccc}#result{display:none;text-align:center}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:650px;margin:16px auto}.rank{background:#fff;border-radius:12px;padding:6px;box-shadow:0 2px 10px #0001}.rank:nth-child(5){border:3px solid #dfb34c}.rank .photo{margin:4px auto;width:80%}.rankno{font-size:10px;color:#999}.rankname{font-weight:700;font-size:14px}.rankgroup{font-size:10px;color:#999}@media(max-width:600px){.cards{gap:5px}.card{padding:4px}.name{font-size:12px}.group{font-size:9px}}</style></head><body><header><h1>중소 남돌 구절판</h1><div class="sub">MY TOP 9</div></header><main><section id="game"><div id="status"></div><div id="cards" class="cards"></div><button id="next" disabled>下一頁</button></section><section id="result"><h2>MY TOP 9</h2><div id="resultGrid" class="result-grid"></div><button onclick="location.reload()">再玩一次</button></section></main><script>

:"GENUS","photo":"genus_01"},{"name":"찬용","group":"GENUS","photo":"genus_02"},{"name":"채훈","group":"GENUS","photo":"genus_03"},{"name":"재영","group":"GENUS","photo":"genus_04"},{"name":"유안","group":"GENUS","photo":"genus_05"},{"name":"이진","group":"ASCENDER","photo":"ascender_01"},{"name":"이들","group":"ASCENDER","photo":"ascender_02"},{"name":"로안","group":"ASCENDER","photo":"ascender_03"},{"name":"지후","group":"ASCENDER","photo":"ascender_04"},{"name":"해솔","group":"ASCENDER","photo":"ascender_05"},{"name":"주현","group":"EMOTI:M","photo":"emotim_01"},{"name":"레이","group":"EMOTI:M","photo":"emotim_02"},{"name":"영호","group":"EMOTI:M","photo":"emotim_03"},{"name":"찬율","group":"EMOTI:M","photo":"emotim_04"},{"name":"진원","group":"EMOTI:M","photo":"emotim_05"},{"name":"권도은","group":"NBIG","photo":"nbig_01"},{"name":"시안","group":"NBIG","photo":"nbig_02"},{"name":"성준","group":"NBIG","photo":"nbig_03"},{"name":"류민","group":"NBIG","photo":"nbig_04"},{"name":"이하준","group":"NBIG","photo":"nbig_05"},{"name":"승연","group":"NBIG","photo":"nbig_06"},{"name":"밍카이","group":"AM8IC","photo":"am8ic_01"},{"name":"루","group":"AM8IC","photo":"am8ic_02"},{"name":"사호","group":"AM8IC","photo":"am8ic_03"},{"name":"청이","group":"AM8IC","photo":"am8ic_04"},{"name":"첸","group":"AM8IC","photo":"am8ic_05"},{"name":"민재","group":"NXON","photo":"nxon_01"},{"name":"케이","group":"NXON","photo":"nxon_02"},{"name":"담","group":"NXON","photo":"nxon_03"},{"name":"지키","group":"NXON","photo":"nxon_04"},{"name":"민규","group":"NXON","photo":"nxon_05"},{"name":"조하","group":"NXON","photo":"nxon_06"},{"name":"케이데이","group":"NXON","photo":"nxon_07"},{"name":"겸","group":"NXON","photo":"nxon_08"},{"name":"순찬","group":"ANOHRTS","photo":"anohrts_01"},{"name":"현제","group":"ANOHRTS","photo":"anohrts_02"},{"name":"다훈","group":"ANOHRTS","photo":"anohrts_03"},{"name":"우현","group":"ANOHRTS","photo":"anohrts_04"},{"name":"기현","group":"ANOHRTS","photo":"anohrts_05"}];const ALL=DATA.map((x,i)=>({...x,id:i}));let pool=[...ALL],round=1,groups=[],gi=0,selected=[],winners=[],selectionHistory=[],pairs=[],pi=0,wins=new Map(),tiePairs=[],ti=0,tieWins=new Map();const $=x=>document.getElementById(x);const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function loadPhoto(box,base){const exts=['jpg','jpeg','png'];let i=0;function go(){if(i>=exts.length){box.textContent='照片';return}const img=new Image();img.onload=()=>{box.textContent='';box.appendChild(img)};img.onerror=go;img.src='./photos/'+base+'.'+exts[i++]+'?v=1'}go()}
function makeGroups(list){let a=shuffle(list),out=[],i=0;while(a.length-i>=9){out.push({people:a.slice(i,i+9),limit:3,label:'9選3'});i+=9}let r=a.slice(i);if(r.length===3)out.push({people:r,limit:1,label:'3選1'});else if(r.length===4)out.push({people:r,limit:2,label:'4選2'});else if(r.length)out.push({people:r,limit:r.length,label:'全部晉級'});return out}
function renderRound(){if(gi>=groups.length){let u=[...new Map(winners.map(x=>[x.id,x])).values()];if(u.length>9){pool=u;round++;startRound()}else startFinal(u);return}let g=groups[gi];selected=[];$('status').textContent=`第 ${round} 輪 ｜ ${gi+1} / ${groups.length} 局 ｜ ${g.label}`;$('cards').innerHTML='';$('next').disabled=true;g.people.forEach(p=>addCard(p,()=>{if(selected.includes(p))selected=selected.filter(x=>x!==p);else if(selected.length<g.limit)selected.push(p);renderSelected();$('next').disabled=selected.length!==g.limit}))}
function renderSelected(){document.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('selected',selected.includes(groups[gi]?.people[i])))}
function addCard(p,fn){let c=document.createElement('div');c.className='card';c.innerHTML=`<div class="photo">照片</div><div class="name">${p.name}</div><div class="group">${p.group}</div>`;loadPhoto(c.querySelector('.photo'),p.photo);c.onclick=fn;$('cards').appendChild(c)}
$('next').onclick=()=>{winners.push(...selected);selectionHistory.push(...selected);gi++;renderRound()};function startRound(){groups=makeGroups(pool);gi=0;winners=[];renderRound()}
function startFinal(c){let final=[...new Map(c.map(x=>[x.id,x])).values()];if(final.length<9){let used=new Set(final.map(x=>x.id));let fillers=[...new Map(selectionHistory.map(x=>[x.id,x])).values()].filter(x=>!used.has(x.id));for(let i=fillers.length-1;i>=0&&final.length<9;i--)final.push(fillers[i])}if(final.length<9){let used=new Set(final.map(x=>x.id));for(let p of ALL)if(!used.has(p.id)&&final.length<9)final.push(p)}c=shuffle(final);pairs=[];for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++)pairs.push([c[i],c[j]]);wins=new Map(c.map(x=>[x.id,0]));pi=0;showPair()}function showPair(){if(pi>=pairs.length){rankFinal();return}let [a,b]=pairs[pi];$('status').textContent=`最終交叉比較 ｜ ${pi+1} / ${pairs.length} ｜ 2選1`;$('cards').innerHTML='';selected=[];$('next').disabled=true;[a,b].forEach(p=>addCard(p,()=>{selected=[p];document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));event.currentTarget.classList.add('selected');$('next').disabled=false}));$('next').onclick=()=>{wins.set(selected[0].id,wins.get(selected[0].id)+1);pi++;showPair()}}
function rankFinal(){let r=[...ALL.filter(x=>wins.has(x.id))].sort((a,b)=>wins.get(b.id)-wins.get(a.id));tiePairs=[];for(let i=0;i<r.length;){let j=i+1;while(j<r.length&&wins.get(r[j].id)===wins.get(r[i].id))j++;if(j-i>1)for(let x=i;x<j;x++)for(let y=x+1;y<j;y++)tiePairs.push([r[x],r[y]]);i=j}if(tiePairs.length){tieWins=new Map(r.map(x=>[x.id,0]));ti=0;showTie(r)}else showResult(r)}function showTie(r){if(ti>=tiePairs.length){r.sort((a,b)=>wins.get(b.id)-wins.get(a.id)||tieWins.get(b.id)-tieWins.get(a.id));showResult(r);return}let [a,b]=tiePairs[ti];$('status').textContent=`同勝場追加比較 ｜ ${ti+1} / ${tiePairs.length} ｜ 2選1`;$('cards').innerHTML='';selected=[];$('next').disabled=true;[a,b].forEach(p=>addCard(p,()=>{selected=[p];document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));event.currentTarget.classList.add('selected');$('next').disabled=false}));$('next').onclick=()=>{tieWins.set(selected[0].id,tieWins.get(selected[0].id)+1);ti++;showTie(r)}}
function showResult(r){$('game').style.display='none';$('result').style.display='block';$('resultGrid').innerHTML='';let top9=r.slice(0,9),order=[3,4,5,1,0,2,6,7,8];order.forEach(i=>{let p=top9[i];if(!p)return;let d=document.createElement('div');d.className='rank';d.innerHTML=`<div class="rankno">${i+1}위</div><div class="photo">照片</div><div class="rankname">${p.name}</div><div class="rankgroup">${p.group}</div>`;loadPhoto(d.querySelector('.photo'),p.photo);$('resultGrid').appendChild(d)})}startRound();</script></body></html>
