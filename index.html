<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>망돌 구절판</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf7f7;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Noto Sans TC",Arial,sans-serif}
header{text-align:center;padding:20px 10px 8px}h1{margin:0;font-size:30px;letter-spacing:2px}.hint{color:#999;font-size:13px;margin-top:5px}
main{width:min(900px,100%);margin:auto;padding:8px 12px 30px}.status{text-align:center;color:#777;font-size:13px;margin:8px 0 14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(720px,100%);margin:auto}.card{background:#fff;border:2px solid transparent;border-radius:13px;padding:7px;box-shadow:0 3px 12px #00000010;cursor:pointer;text-align:center}.card.selected{border-color:#e78aa7;background:#fff0f4;transform:translateY(-2px)}
.photo{width:100%;aspect-ratio:1;background:#eee;border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}.photo img{width:100%;height:100%;object-fit:cover;display:block}
.name{font-weight:750;font-size:15px;margin-top:6px}.group{font-size:11px;color:#999;margin-top:2px}button{display:block;margin:18px auto 0;border:0;border-radius:24px;padding:11px 42px;font-size:15px;background:#333;color:#fff}button:disabled{background:#ccc}
#result{display:none;text-align:center}.result-grid{width:min(650px,100%);margin:18px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rank{background:#fff;border-radius:13px;padding:7px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 12px #00000010}.rank:nth-child(5){border:3px solid #e0b34f;min-height:160px}.rank .photo{width:80%;margin:5px 0}.rankno{font-size:11px;color:#aaa}.rankname{font-weight:750;font-size:16px}.rankgroup{font-size:11px;color:#999}
@media(max-width:600px){h1{font-size:26px}.cards{gap:5px}.card{padding:5px}.name{font-size:12px}.group{font-size:9px}.result-grid{gap:5px}.rank{min-height:105px}.rank:nth-child(5){min-height:135px}.rankname{font-size:13px}}
</style></head><body><header><h1>망돌 구절판</h1><div class="hint">나의 망돌 TOP 9을 찾아보세요</div></header><main>
<section id="game"><div id="status" class="status"></div><div id="cards" class="cards"></div><button id="next" disabled>下一頁</button></section>
<section id="result"><h2>MY TOP 9</h2><p>所有最終候選人都完成 2 選 1 交叉比較</p><div id="resultGrid" class="result-grid"></div><button onclick="location.reload()">再玩一次</button></section></main>
<script>
const DATA=[["하빛", "TRENDZ"], ["리온", "TRENDZ"], ["윤우", "TRENDZ"], ["조한국", "TRENDZ"], ["라엘", "TRENDZ"], ["은일", "TRENDZ"], ["정예찬", "TRENDZ"], ["이승현", "AIMERS"], ["최은준", "AIMERS"], ["김도륜", "AIMERS"], ["김요엘", "AIMERS"], ["박승환", "AIMERS"], ["황우영", "AIMERS"], ["김희수", "The Wind"], ["타나톤", "The Wind"], ["최한빈", "The Wind"], ["박하유찬", "The Wind"], ["안찬원", "The Wind"], ["장현준", "The Wind"], ["카즈타", "n.SSign"], ["도하", "n.SSign"], ["성윤", "n.SSign"], ["로빈", "n.SSign"], ["한준", "n.SSign"], ["로렌스", "n.SSign"], ["희원", "n.SSign"], ["동재", "EASTSHINE"], ["IEL", "EASTSHINE"], ["현", "EASTSHINE"], ["루민", "EASTSHINE"], ["피닉스", "EASTSHINE"], ["고현", "WAKER"], ["권협", "WAKER"], ["이준", "WAKER"], ["리오", "WAKER"], ["새별", "WAKER"], ["세범", "WAKER"], ["세이타", "DXMON"], ["민재", "DXMON"], ["HEE", "DXMON"], ["태극", "DXMON"], ["REX", "DXMON"], ["이안", "NCHIVE"], ["하엘", "NCHIVE"], ["강산", "NCHIVE"], ["유찬", "NCHIVE"], ["주영", "NCHIVE"], ["엔", "NCHIVE"], ["왕석", "SW:C"], ["휘", "SW:C"], ["진", "SW:C"], ["타이키", "SW:C"], ["사토시", "SW:C"], ["건", "SW:C"], ["리쿠토", "SW:C"], ["구현", "BE BOYS"], ["민준", "BE BOYS"], ["윤서", "BE BOYS"], ["학성", "BE BOYS"], ["타쿠마", "BE BOYS"], ["원천", "BE BOYS"], ["채민", "N.TOP"], ["민서", "N.TOP"], ["희우", "N.TOP"], ["현웅", "N.TOP"], ["강현", "N.TOP"], ["창림", "N.TOP"], ["타쿠토", "N.TOP"], ["강빈", "CHSAER"], ["케이스케", "CHSAER"], ["렌", "CHSAER"], ["윤성", "CHSAER"], ["시훈", "CHSAER"], ["테츠", "AmbiO"], ["지수", "AmbiO"], ["루원", "AmbiO"], ["기원", "AmbiO"], ["승상", "AmbiO"], ["서하", "GENUS"], ["찬용", "GENUS"], ["채훈", "GENUS"], ["재영", "GENUS"], ["유안", "GENUS"], ["이진", "ASCENDER"], ["이들", "ASCENDER"], ["로안", "ASCENDER"], ["지후", "ASCENDER"], ["해솔", "ASCENDER"], ["주현", "EMOTI:M"], ["레이", "EMOTI:M"], ["영호", "EMOTI:M"], ["찬율", "EMOTI:M"], ["진원", "EMOTI:M"], ["권도은", "NBIG"], ["시안", "NBIG"], ["성준", "NBIG"], ["류민", "NBIG"], ["이하준", "NBIG"], ["승연", "NBIG"], ["밍카이", "AM8IC"], ["루", "AM8IC"], ["사호", "AM8IC"], ["청이", "AM8IC"], ["첸", "AM8IC"], ["민재", "NXON"], ["케이", "NXON"], ["담", "NXON"], ["지키", "NXON"], ["민규", "NXON"], ["조하", "NXON"], ["케이데이", "NXON"], ["겸", "NXON"], ["순찬", "ANOHRTS"], ["현제", "ANOHRTS"], ["다훈", "ANOHRTS"], ["우현", "ANOHRTS"], ["기현", "ANOHRTS"]];const ALL=DATA.map((x,i)=>({id:i,name:x[0],group:x[1]}));let pool=[...ALL],round=1,groups=[],gi=0,selected=[],finalCandidates=[],finalPairs=[],pairIndex=0,wins=new Map(),tieQueue=[],tieResults=null,tieIndex=0,tieTotal=0;
const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function loadPhoto(box,name){const exts=["jpg","jpeg","png"];let i=0;function go(){if(i>=exts.length){box.textContent="照片";return}const img=new Image(),e=exts[i++];img.onload=()=>{box.textContent="";box.appendChild(img)};img.onerror=go;img.src="photos/"+encodeURIComponent(name)+"."+e}go()}
function makeGroups(list){const a=shuffle(list),out=[];let i=0;while(a.length-i>=9){out.push({people:a.slice(i,i+9),limit:3,mode:"9選3"});i+=9}const rem=a.slice(i);if(rem.length===3)out.push({people:rem,limit:1,mode:"3選1"});else if(rem.length===4)out.push({people:rem,limit:2,mode:"4選2"});else if(rem.length>0)out.push({people:rem,limit:rem.length,mode:"全部晉級"});return out}
function startRound(){groups=makeGroups(pool);gi=0;selected=[];window.roundWinners=[];showGroup()}
function showGroup(){if(gi>=groups.length){endRound();return}const g=groups[gi];selected=[];$("status").textContent=`第 ${round} 輪 ｜ ${gi+1} / ${groups.length} 局 ｜ ${g.mode}`;$("cards").innerHTML="";
g.people.forEach(p=>{const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="photo">照片</div><div class="name">${p.name}</div><div class="group">${p.group}</div>`;loadPhoto(c.querySelector(".photo"),p.name);c.onclick=()=>{if(selected.includes(p)){selected=selected.filter(x=>x!==p);c.classList.remove("selected")}else if(selected.length<g.limit){selected.push(p);c.classList.add("selected")}$("next").disabled=selected.length!==g.limit};$("cards").appendChild(c)});$("next").disabled=true}
$("next").onclick=()=>{window.roundWinners.push(...selected);gi++;showGroup()}
function endRound(){const winners=[...new Map(window.roundWinners.map(x=>[x.id,x])).values()];if(winners.length>9){pool=winners;round++;startRound()}else startFinal(winners)}
function startFinal(cands){finalCandidates=shuffle(cands);if(finalCandidates.length<9){const used=new Set(finalCandidates.map(x=>x.id));for(const x of shuffle(ALL))if(!used.has(x.id)){finalCandidates.push(x);used.add(x.id);if(finalCandidates.length===9)break}}finalCandidates=finalCandidates.slice(0,9);finalPairs=[];for(let i=0;i<finalCandidates.length;i++)for(let j=i+1;j<finalCandidates.length;j++)finalPairs.push([finalCandidates[i],finalCandidates[j]]);pairIndex=0;wins=new Map(finalCandidates.map(x=>[x.id,0]));showFinalPair()}
function showFinalPair(){if(pairIndex>=finalPairs.length){resolveRanking();return}const [a,b]=finalPairs[pairIndex];$("status").textContent=`最終交叉比較 ｜ ${pairIndex+1} / ${finalPairs.length} ｜ 2選1`;$("cards").innerHTML="";selected=[];$("next").disabled=true;[a,b].forEach(p=>{const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="photo">照片</div><div class="name">${p.name}</div><div class="group">${p.group}</div>`;loadPhoto(c.querySelector(".photo"),p.name);c.onclick=()=>{selected=[p];document.querySelectorAll(".card").forEach(x=>x.classList.remove("selected"));c.classList.add("selected");$("next").disabled=false};$("cards").appendChild(c)});$("next").onclick=()=>{wins.set(selected[0].id,wins.get(selected[0].id)+1);pairIndex++;showFinalPair()}}
function resolveRanking(){let ranked=[...finalCandidates].sort((a,b)=>wins.get(b.id)-wins.get(a.id));tieQueue=[];for(let i=0;i<ranked.length;){let j=i+1;while(j<ranked.length&&wins.get(ranked[j].id)===wins.get(ranked[i].id))j++;if(j-i>1){const group=ranked.slice(i,j);for(let x=0;x<group.length;x++)for(let y=x+1;y<group.length;y++)tieQueue.push([group[x],group[y]])}i=j}if(tieQueue.length){runTieBreak(ranked)}else showResult(ranked)}
function runTieBreak(ranked){tieResults=new Map(ranked.map(x=>[x.id,0]));tieIndex=0;tieTotal=tieQueue.length;showTiePair(ranked)}
function showTiePair(ranked){if(tieIndex>=tieTotal){finishTieRanking(ranked);return}const [a,b]=tieQueue[tieIndex];$("status").textContent=`同勝場追加比較 ｜ ${tieIndex+1} / ${tieTotal} ｜ 2選1`;$("cards").innerHTML="";selected=[];$("next").disabled=true;[a,b].forEach(p=>{const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="photo">照片</div><div class="name">${p.name}</div><div class="group">${p.group}</div>`;loadPhoto(c.querySelector(".photo"),p.name);c.onclick=()=>{selected=[p];document.querySelectorAll(".card").forEach(x=>x.classList.remove("selected"));c.classList.add("selected");$("next").disabled=false};$("cards").appendChild(c)});$("next").onclick=()=>{tieResults.set(selected[0].id,tieResults.get(selected[0].id)+1);tieIndex++;showTiePair(ranked)}}
function finishTieRanking(ranked){ranked.sort((a,b)=>{const w=wins.get(b.id)-wins.get(a.id);if(w!==0)return w;return tieResults.get(b.id)-tieResults.get(a.id)});showResult(ranked)}
function showResult(ranked){$("game").style.display="none";$("result").style.display="block";$("resultGrid").innerHTML="";[3,4,5,1,0,2,6,7,8].forEach(idx=>{const p=ranked[idx],d=document.createElement("div");d.className="rank";d.innerHTML=`<div class="rankno">${idx+1}위</div><div class="photo">照片</div><div class="rankname">${p.name}</div><div class="rankgroup">${p.group}</div>`;loadPhoto(d.querySelector(".photo"),p.name);$("resultGrid").appendChild(d)})}
startRound();
</script></body></html>
