<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>망돌 구절판</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf7f5;color:#333;font-family:Arial,"Noto Sans KR",sans-serif}
header{text-align:center;padding:28px 16px 12px}
h1{margin:0;font-size:34px;letter-spacing:2px}
.subtitle{color:#999;margin-top:8px}
#app{max-width:1100px;margin:auto;padding:15px}
.status{text-align:center;margin:8px 0 20px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border:3px solid transparent;border-radius:18px;padding:14px;text-align:center;cursor:pointer;box-shadow:0 4px 14px #0000000d;transition:.18s}
.card:hover{transform:translateY(-2px)}
.card.selected{border-color:#e58aa6;background:#fff1f5}
.photo{width:100%;aspect-ratio:1;border-radius:13px;background:#eee;display:flex;align-items:center;justify-content:center;color:#aaa;margin-bottom:10px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.name{font-size:19px;font-weight:700}.group{color:#999;margin-top:4px}
button{display:block;margin:25px auto;padding:13px 52px;border:0;border-radius:28px;background:#333;color:#fff;font-size:16px;cursor:pointer}
button:disabled{background:#ccc;cursor:not-allowed}
#result{display:none;text-align:center}
.grid{max-width:720px;margin:25px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rank{background:#fff;border-radius:18px;padding:12px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 14px #0000000d}
.rank-1{min-height:215px;border:3px solid #dfb74e}
.rank-number{font-size:13px;color:#aaa;margin-bottom:5px}.rank-name{font-size:21px;font-weight:700}.rank-group{color:#999;margin-top:4px}
.rank .photo{width:80%;margin:8px 0}
.restart{background:#e58aa6}
@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:9px;border-radius:14px}.name{font-size:16px}.group{font-size:13px}.grid{gap:7px}.rank{min-height:135px;padding:7px}.rank-1{min-height:165px}.rank-name{font-size:15px}.rank .photo{width:85%}h1{font-size:29px}}
</style>
</head>
<body>
<header>
<h1>망돌 구절판</h1>
<div class="subtitle">나의 망돌 TOP 9을 찾아보세요</div>
</header>

<div id="app">
<section id="game">
<div class="status" id="status"></div>
<div class="cards" id="cards"></div>
<button id="nextBtn" disabled>下一頁</button>
</section>

<section id="result">
<h2>MY TOP 9</h2>
<p>나의 망돌 구절판</p>
<div class="grid" id="resultGrid"></div>
<button class="restart" onclick="location.reload()">再玩一次</button>
</section>
</div>

<script>
const raw = [
["하빛","TRENDZ"],["리온","TRENDZ"],["윤우","TRENDZ"],["조한국","TRENDZ"],["라엘","TRENDZ"],["은일","TRENDZ"],["정예찬","TRENDZ"],
["이승현","AIMERS"],["최은준","AIMERS"],["김도륜","AIMERS"],["김요엘","AIMERS"],["박승환","AIMERS"],["황우영","AIMERS"],
["김희수","The Wind"],["타나톤","The Wind"],["최한빈","The Wind"],["박하유찬","The Wind"],["안찬원","The Wind"],["장현준","The Wind"],
["카즈타","n.SSign"],["도하","n.SSign"],["성윤","n.SSign"],["로빈","n.SSign"],["한준","n.SSign"],["로렌스","n.SSign"],["희원","n.SSign"],
["동재","EASTSHINE"],["IEL","EASTSHINE"],["현","EASTSHINE"],["루민","EASTSHINE"],["피닉스","EASTSHINE"],
["고현","WAKER"],["권협","WAKER"],["이준","WAKER"],["리오","WAKER"],["새별","WAKER"],["세범","WAKER"],
["세이타","DXMON"],["민재","DXMON"],["HEE","DXMON"],["태극","DXMON"],["REX","DXMON"],
["이안","NCHIVE"],["하엘","NCHIVE"],["강산","NCHIVE"],["유찬","NCHIVE"],["주영","NCHIVE"],["엔","NCHIVE"],
["왕석","SW:C"],["휘","SW:C"],["진","SW:C"],["타이키","SW:C"],["사토시","SW:C"],["건","SW:C"],["리쿠토","SW:C"],
["구현","BE BOYS"],["민준","BE BOYS"],["윤서","BE BOYS"],["학성","BE BOYS"],["타쿠마","BE BOYS"],["원천","BE BOYS"],
["채민","N.TOP"],["민서","N.TOP"],["희우","N.TOP"],["현웅","N.TOP"],["강현","N.TOP"],["창림","N.TOP"],["타쿠토","N.TOP"],
["강빈","CHSAER"],["케이스케","CHSAER"],["렌","CHSAER"],["윤성","CHSAER"],["시훈","CHSAER"],
["테츠","AmbiO"],["지수","AmbiO"],["루원","AmbiO"],["기원","AmbiO"],["승상","AmbiO"],
["서하","GENUS"],["찬용","GENUS"],["채훈","GENUS"],["재영","GENUS"],["유안","GENUS"],
["이진","ASCENDER"],["이들","ASCENDER"],["로안","ASCENDER"],["지후","ASCENDER"],["해솔","ASCENDER"],
["주현","EMOTI:M"],["레이","EMOTI:M"],["영호","EMOTI:M"],["찬율","EMOTI:M"],["진원","EMOTI:M"],
["권도은","NBIG"],["시안","NBIG"],["성준","NBIG"],["류민","NBIG"],["이하준","NBIG"],["승연","NBIG"],
["밍카이","AM8IC"],["루","AM8IC"],["사호","AM8IC"],["청이","AM8IC"],["첸","AM8IC"],
["민재","NXON"],["케이","NXON"],["담","NXON"],["지키","NXON"],["민규","NXON"],["조하","NXON"],["케이데이","NXON"],["겸","NXON"],
["순찬","ANOHRTS"],["현제","ANOHRTS"],["다훈","ANOHRTS"],["우현","ANOHRTS"],["기현","ANOHRTS"]
];

const idols=raw.map((x,i)=>({id:i,name:x[0],group:x[1]}));
let pool=[...idols], round=1, pages=[], page=0, winners=[], selected=[];
const $=id=>document.getElementById(id);

function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function unique(a){return [...new Map(a.map(x=>[x.id,x])).values()]}

/*
  每一輪的目標：
  - 正常階段：9 選 3
  - 當剩餘人數已經接近 9 時，動態分成 2 選 1，
    讓本輪結束後剛好得到下一輪需要的人數。
  - 絕不因為一局結束就直接出最終結果。
*/
function buildRound(){
  winners=[];
  pages=[];
  const a=shuffle(pool);

  if(a.length<=9){
    showFinal(a);
    return;
  }

  /*
    先盡可能做 9選3，但預留最後的收斂。
    我們把候選人分成多個局；每局可選 3。
    若最後剩下的數量不足 9，最後幾局改成 2選1，
    讓下一輪人數落在 9~11 左右，再繼續。
  */
  let i=0;
  while(a.length-i>=9){
    const remain=a.length-i;
    const groupsLeft=Math.ceil(remain/9);
    const desired=Math.max(9, Math.ceil(remain/3));
    // 一般每局9選3；若做完會讓總勝出數低於9，進入收斂局
    if(remain<27 && Math.ceil(remain/3)<9) break;
    pages.push({type:9, list:a.slice(i,i+9)});
    i+=9;
  }

  const tail=a.slice(i);

  if(tail.length){
    if(tail.length===1){
      // 單人直接晉級，避免丟失
      winners.push(tail[0]);
    }else if(tail.length<=8){
      // tail 以 2選1 組局；最後若單數，最後一人直接保留
      let j=0;
      while(j+1<tail.length){
        pages.push({type:2,list:tail.slice(j,j+2)});
        j+=2;
      }
      if(j<tail.length) winners.push(tail[j]);
    }else{
      // 9人以上的尾巴重新切9選3
      for(let j=0;j<tail.length;j+=9){
        const g=tail.slice(j,j+9);
        if(g.length>=9) pages.push({type:9,list:g});
        else if(g.length>=2) for(let k=0;k+1<g.length;k+=2) pages.push({type:2,list:g.slice(k,k+2)});
        else winners.push(g[0]);
      }
    }
  }

  page=0;
  showPage();
}

function showPage(){
  if(page>=pages.length){finishRound();return}
  selected=[];
  const p=pages[page];
  $("status").textContent=`第 ${round} 輪　｜　${page+1} / ${pages.length} 局　｜　${p.type==="9"?"9 選 3":"2 選 1"}`;
  const box=$("cards"); box.innerHTML="";
  p.list.forEach(idol=>{
    const c=document.createElement("div"); c.className="card";
    const safe=encodeURIComponent(idol.name);
    c.innerHTML=`<div class="photo"><img src="photos/${safe}.jpg" alt="${idol.name}" onerror="this.style.display='none';this.parentElement.textContent='照片';"></div><div class="name">${idol.name}</div><div class="group">${idol.group}</div>`;
    c.onclick=()=>choose(idol,c,p.type==="9"?3:1);
    box.appendChild(c);
  });
  $("nextBtn").disabled=true;
}

function choose(idol,card,limit){
  if(selected.includes(idol)){
    selected=selected.filter(x=>x!==idol); card.classList.remove("selected");
  }else{
    if(selected.length>=limit)return;
    selected.push(idol); card.classList.add("selected");
  }
  $("nextBtn").disabled=selected.length!==limit;
}

$("nextBtn").onclick=()=>{
  winners.push(...selected);
  page++;
  showPage();
}

function finishRound(){
  winners=unique(winners);
  if(winners.length<=9){
    // 如果剛好9人，直接結果；若少於9，從本輪未晉級者中補足，
    // 只作為極端尾數保護，不影響主要多輪篩選。
    if(winners.length<9){
      const extra=shuffle(pool.filter(x=>!winners.some(y=>y.id===x.id)));
      winners=unique([...winners,...extra]).slice(0,9);
    }
    showFinal(winners);
    return;
  }
  pool=winners;
  round++;
  buildRound();
}

function showFinal(finalists){
  const final=finalists.slice(0,9);
  $("game").style.display="none";
  $("result").style.display="block";
  const order=[3,4,5,1,0,2,6,7,8]; // 4 5 6 / 2 1 3 / 7 8 9
  $("resultGrid").innerHTML="";
  order.forEach(idx=>{
    const idol=final[idx];
    const d=document.createElement("div");
    d.className="rank "+(idx===0?"rank-1":"");
    const safe=encodeURIComponent(idol.name);
    d.innerHTML=`<div class="rank-number">${idx+1}위</div><div class="photo"><img src="photos/${safe}.jpg" alt="${idol.name}" onerror="this.style.display='none';this.parentElement.textContent='照片';"></div><div class="rank-name">${idol.name}</div><div class="rank-group">${idol.group}</div>`;
    $("resultGrid").appendChild(d);
  });
}

buildRound();
</script>
</body>
</html>
